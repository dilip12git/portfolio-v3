<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (SEO optimized) -->
    <title>Dilip Kumar Teli | Full Stack & AI Developer</title>

    <!-- Canonical -->
    <link rel="canonical" href="https://dilip-kumar-teli.web.app" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Dilip Kumar Teli is a Web and Mobile App Developer specializing in React, React Native, and MERN stack. Explore projects, skills, and experience."
    />
    <meta
      name="keywords"
      content="Dilip Kumar Teli, React Developer, MERN Stack Developer, React Native Developer, Portfolio, Web Developer India"
    />
    <meta name="author" content="Dilip Kumar Teli" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Performance -->
    <link rel="preload" as="image" href="/dilip-img1.jpg" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dilip Kumar Teli | Full Stack & AI Developer" />
    <meta
      property="og:description"
      content="Explore projects, skills, and experience of Dilip Kumar Teli in web and mobile app development."
    />
    <meta
      property="og:image"
      content="https://dilip-kumar-teli.web.app/dilip-img1.jpg"
    />
    <meta property="og:url" content="https://dilip-kumar-teli.web.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dilip Kumar Teli | Full Stack & AI Developer" />
    <meta
      name="twitter:description"
      content="Discover Dilip Kumar Teli’s portfolio featuring React, React Native, and MERN stack projects."
    />
    <meta
      name="twitter:image"
      content="https://dilip-kumar-teli.web.app/dilip-large-img.jpeg"
    />

    <!-- Fonts (optimized loading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Ovo:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dilip Kumar Teli",
        "url": "https://dilip-kumar-teli.web.app",
        "image": "https://dilip-kumar-teli.web.app/dilip-img1.jpg",
        "jobTitle": "Full Stack & AI Developer",
        "description": "Web and Mobile App Developer specializing in React, React Native, and MERN stack.",
        "sameAs": [
          "https://www.linkedin.com/in/dilipgpta",
          "https://github.com/dilip12git"
        ]
      }
    </script>
  </head>

  <body class="bg-white dark:bg-[var(--dark-theme)]">
    <div id="root"></div>

    <!-- Vite Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
